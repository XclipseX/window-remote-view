[package]
name = "rv-win-ui"
description = "RemoteView Windows desktop UI (egui)"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "RemoteView"
path = "src/main.rs"

[features]
# Release builds: embed wdi-simple.exe (libwdi, LGPL-3) from assets/ so the
# driver installer needs no extra file. CI builds it into assets/ first.
embed-wdi = []

[dependencies]
rv-host-win = { path = "../../crates/host-win" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"]
