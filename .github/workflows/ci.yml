name: CI
permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo build --release -p rv-signal-relay -p rv-host-win
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            target/release/rv-signal-relay
            target/release/rv-signal-relay.exe
            target/release/rv-host.exe
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  publish:
    needs: [rust, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect files
        run: |
          mkdir out
          cp dl/android-debug-apk/*.apk out/RemoteView-debug.apk
          cp dl/binaries-windows-latest/rv-host.exe out/ || true
          cp dl/binaries-windows-latest/rv-signal-relay.exe out/ || true
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Bản build mới nhất (tự động)
          prerelease: true
          make_latest: false
          body: |
            Bản build tự động từ commit ${{ github.sha }}.
            - RemoteView-debug.apk: cài lên Android (Tab S10+ / S26+)
            - rv-host.exe: chạy trên Windows
          files: out/*
