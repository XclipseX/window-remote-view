name: CI
permissions:
  contents: write

# Bản push mới hủy bản cũ đang chạy, tránh bản cũ đăng đè APK mới lên Release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo build --release -p rv-signal-relay
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            target/release/rv-signal-relay
            target/release/rv-signal-relay.exe
          if-no-files-found: ignore

  # wdi-simple.exe from libwdi (LGPL-3, the library behind Zadig): installs WinUSB
  # automatically at runtime. Best-effort: if this job fails, RemoteView.exe is
  # still built, just without the embedded installer (the app then reports
  # "thiếu wdi-simple.exe" instead of installing the driver).
  wdi:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - id: wdicache
        uses: actions/cache@v4
        with:
          path: out/wdi-simple.exe
          key: wdi-simple-v1
      - uses: msys2/setup-msys2@v2
        if: steps.wdicache.outputs.cache-hit != 'true'
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git
      - uses: actions/checkout@v4
        if: steps.wdicache.outputs.cache-hit != 'true'
        with:
          repository: pbatard/libwdi
          path: libwdi
          fetch-depth: 1
          submodules: recursive
      - name: Download WDK redistributables (WinUSB co-installers)
        if: steps.wdicache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -L "https://go.microsoft.com/fwlink/p/?LinkID=253170" -o wdk-redist.msi
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\libwdi\wdk
      - name: Build wdi-simple.exe
        if: steps.wdicache.outputs.cache-hit != 'true'
        working-directory: libwdi
        run: |
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 \
            --disable-32bit --disable-debug --disable-shared --enable-examples-build \
            --with-wdkdir="wdk/Windows Kits/8.0" --with-wdfver=1011 LDFLAGS="-static"
          make
          ls -la examples/*.exe
          mkdir -p ../out
          cp examples/wdi-simple.exe ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: wdi-simple
          path: out/wdi-simple.exe
          if-no-files-found: error

  # The single Windows app: RemoteView.exe contains the host engine (run as
  # `RemoteView.exe --host-worker`) and, when available, the embedded WinUSB installer.
  windows-app:
    needs: [wdi]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app-nasm
      # NASM: without it openh264-sys2 silently builds the encoder without SIMD assembly (slow, blurry fallback).
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wdi-simple
          path: apps/win-ui/assets
      # SudoVDA virtual display driver (MIT): the signed SudoVDA.dll/.cat/.inf + cert ship inside
      # the Apollo release installer; take them from there so RemoteView can create its own monitor.
      - uses: actions/cache@v4
        id: vddcache
        with:
          path: apps/win-ui/assets/sudovda
          key: sudovda-apollo-v1
      - name: Fetch SudoVDA driver
        if: steps.vddcache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = gh api repos/ClassicOldSong/Apollo/releases/latest | ConvertFrom-Json
          Write-Host "Apollo release $($rel.tag_name): $($rel.assets.name -join ', ')"
          $asset = $rel.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match '\.msi$' } | Select-Object -First 1 }
          if (-not $asset) { throw "no installer asset" }
          $pkg = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest $asset.browser_download_url -OutFile $pkg
          $x = Join-Path $env:RUNNER_TEMP 'apollo-x'
          if ($asset.name -match '\.msi$') {
            Start-Process msiexec -ArgumentList "/a `"$pkg`" /qn TARGETDIR=`"$x`"" -Wait
          } else {
            7z x $pkg "-o$x" -y | Out-Null
          }
          $dll = Get-ChildItem $x -Recurse -Filter SudoVDA.dll | Select-Object -First 1
          if (-not $dll) { Get-ChildItem $x -Recurse | Select-Object -First 80 FullName; throw "SudoVDA.dll not found" }
          $src = $dll.DirectoryName
          Get-ChildItem $src | Format-Table Name, Length
          $dst = 'apps/win-ui/assets/sudovda'
          New-Item -ItemType Directory -Force $dst | Out-Null
          foreach ($f in 'SudoVDA.dll','SudoVDA.inf','sudovda.cat','sudovda.cer') {
            $m = Get-ChildItem $src -Filter $f | Select-Object -First 1
            if (-not $m) { throw "missing $f next to SudoVDA.dll" }
            Copy-Item $m.FullName (Join-Path $dst $f)
          }
          Get-AuthenticodeSignature (Join-Path $dst 'sudovda.cat') | Format-List Status, SignerCertificate
      - name: Build RemoteView.exe
        shell: pwsh
        env:
          RV_BUILD_SHA: ${{ github.sha }}
        run: |
          $feat = @()
          if (Test-Path apps/win-ui/assets/wdi-simple.exe) {
            Write-Host "Embedding wdi-simple.exe"
            $feat += 'embed-wdi'
          } else {
            Write-Host "::warning::wdi-simple.exe missing; building without the embedded driver installer"
          }
          $vdd = 'SudoVDA.dll','SudoVDA.inf','sudovda.cat','sudovda.cer' | ForEach-Object { Test-Path "apps/win-ui/assets/sudovda/$_" }
          if ($vdd -notcontains $false) {
            Write-Host "Embedding SudoVDA virtual display driver"
            $feat += 'embed-vdd'
          } else {
            Write-Host "::warning::SudoVDA missing; building without the virtual display driver"
          }
          if ($feat.Count -gt 0) {
            cargo build --release -p rv-win-ui --features ($feat -join ',')
          } else {
            cargo build --release -p rv-win-ui
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteView-windows
          path: target/release/RemoteView.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # Lõi Rust -> app/src/main/jniLibs/arm64-v8a/librv_core.so (gradle tự đóng gói vào APK).
      - name: Build librv_core.so (cargo-ndk)
        working-directory: ${{ github.workspace }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -o apps/android/app/src/main/jniLibs build --release -p rv-android-core
          ls -la apps/android/app/src/main/jniLibs/arm64-v8a/
          test -f apps/android/app/src/main/jniLibs/arm64-v8a/librv_core.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - run: gradle assembleDebug --stacktrace
        env:
          RV_VERSION_CODE: ${{ github.run_number }}
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk
      - name: Verify native lib is packaged in the APK
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep lib/arm64-v8a/librv_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  publish:
    needs: [rust, android, windows-app]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect files
        run: |
          mkdir out
          cp dl/android-debug-apk/*.apk out/RemoteView.apk
          cp dl/RemoteView-windows/RemoteView.exe out/RemoteView.exe
          cp dl/binaries-windows-latest/rv-signal-relay.exe out/ || true
          ls -la out
      # softprops cannot delete assets: drop stale ones from older releases.
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in rv-host.exe RemoteView-debug.apk; do
            gh release delete-asset latest-build "$a" -y --repo "${{ github.repository }}" || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Bản build mới nhất (tự động)
          prerelease: true
          make_latest: false
          body: |
            Bản build tự động từ commit ${{ github.sha }}.
            - RemoteView.apk (đã ký, cài đè được bản trước): cài lên Android (Tab S10+ / S26+)
            - RemoteView.exe: app Windows duy nhất (một file, không cần file phụ). Cắm cáp USB, nhấn "Kết nối"; driver USB tự cài, không cần Zadig, không cần nhập PIN.
            - Giấy phép: trình cài driver nhúng là wdi-simple của libwdi (LGPL-3), xem NOTICE.
          files: out/*
