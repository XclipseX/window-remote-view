[package]
name = "rv-host-win"
description = "Windows host: DXGI capture, virtual display, encode, WASAPI audio, input injection"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "rv-host"
path = "src/main.rs"

[dependencies]
rv-proto = { path = "../proto" }
rv-crypto = { path = "../crypto" }
rv-session = { path = "../session" }
rv-usb-link = { path = "../usb-link" }
openh264 = "0.9"
opus = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_Display",
]
