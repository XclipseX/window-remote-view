[package]
name = "rv-transport"
description = "Low-latency UDP transport helpers: adaptive FEC, LAN discovery, send pacer, path racing"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
if-addrs = "0.15.0"
reed-solomon-simd = "3"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "1"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
